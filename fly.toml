# fly.toml app configuration file generated for tablemate on 2026-01-07T23:00:34-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tablemate'
primary_region = 'ewr'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8080'
  FRONTEND_ORIGINS = 'https://tablemate.work,https://www.tablemate.work,https://tablemate-64d1d.web.app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
